<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The mark for 16 to 32 px. Drawn on a 16 px grid (64 units per pixel) with thicker
       strokes and larger nodes, and the arc and the bowl run into the nodes so no
       gap is thinner than a pixel. -->
  <g fill="#D5642A">
    <!-- the arc over the top, ending in the hollow node -->
    <path fill-rule="evenodd" d="M766.5 384A352 352 0 1 0 66.5 458.1A96 96 0 0 0 231.9 543.6A224 224 0 1 1 637.7 384ZM128 480a32 32 0 1 0 64 0a32 32 0 1 0 -64 0Z"/>
    <!-- the stem and the bowl, ending in the bottom node -->
    <path d="M640 576L640 608A224 224 0 0 1 377.2 828.6A96 96 0 1 0 331.3 949.7A352 352 0 0 0 640 879.5L640 960L768 960L768 576Z"/>
    <!-- the right node, the arrow shaft and the arrow head -->
    <circle cx="480" cy="480" r="96"/>
    <rect x="480" y="448" width="368" height="64"/>
    <path d="M832 304L1008 480L832 656Z"/>
  </g>
  <!-- the links between the nodes -->
  <path fill="none" stroke="#D5642A" stroke-width="64" d="M224 480H480M180.2 540.7L288 864M480 480L288 864"/>
</svg>
