[package]
# The remote web page, written in Rust with Leptos and built for the browser
# (wasm32-unknown-unknown) with Trunk. It isn't part of arko-tui's build:
# the built files go in ../src/remote/next/, which arko-tui embeds. See
# README.md here for how to build it.
name = "arko-web"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

# Its own workspace, with its own lock file and target folder. theme-css
# runs on the build's computer, before each build.
[workspace]
members = ["theme-css"]

[dependencies]
leptos = { version = "0.8.22", features = ["csr"] }
lucide-leptos = { version = "3.61.0", default-features = false, features = ["account", "arrows", "development", "shapes", "layout", "notifications"] }
pulldown-cmark = { version = "0.13.5", default-features = false }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.115", features = ["raw_value"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "Element",
    "EventSource",
    "Headers",
    "HtmlElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MessageEvent",
    "Navigator",
    "Performance",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "ResizeObserver",
    "Response",
    "ScrollBehavior",
    "ScrollToOptions",
    "Storage",
    "WheelEvent",
    "Window",
    "HtmlCollection",
    "Clipboard",
    "PopStateEvent",
    "VisibilityState",
    "EventTarget",
    "Event",
    "HtmlSelectElement",
    "HtmlInputElement",
    "HtmlDialogElement",
    "History",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
