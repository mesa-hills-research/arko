[package]
name = "arko"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A general-purpose agent for the terminal, built on arko_workflows"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "arko"
path = "src/main.rs"

[dependencies]
arko_ai = { path = "../arko_framework/arko_ai" }
arko_agents = { path = "../arko_framework/arko_agents" }
arko_workflows = { path = "../arko_framework/arko_workflows" }
arko_index = { path = "../arko_framework/arko_index" }

async-trait = "0.1.79"
# The system clipboard, for the full-screen view's copies: X11 (and
# XWayland), Wayland where the compositor has data-control, macOS, Windows.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# The remote web page's server (--remote): HTTP/1.1, JSON and SSE only.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
# The full-screen view (the default front end): terminal events as a
# stream, and copying through the terminal (OSC 52).
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"] }
dotenvy = "0.15.7"
env_logger = "0.10"
futures-util = "0.3.31"
getrandom = "0.3.3"
if-addrs = "0.15.0"
ignore = "0.4.22"
log = "0.4.21"
qrcodegen = "1.8.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
subtle = "2.6.1"
tokio = { version = "1.37.0", features = ["full"] }
unicode-width = "0.2.0"
uuid = { version = "1.8.0", features = ["v4"] }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
# Tests of the remote's server (built as arko_ai builds it).
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3"
