[package]
name = "finn"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A general-purpose agent for the terminal, built on arko_workflows"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "fin"
path = "src/main.rs"

[dependencies]
arko_ai = { path = "../arko_framework/arko_ai" }
arko_agents = { path = "../arko_framework/arko_agents" }
arko_workflows = { path = "../arko_framework/arko_workflows" }

async-trait = "0.1.79"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15.7"
env_logger = "0.10"
log = "0.4.21"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
tokio = { version = "1.37.0", features = ["full"] }
uuid = { version = "1.8.0", features = ["v4"] }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
