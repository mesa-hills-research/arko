[package]
# The command and the library are both `arko`. The name `arko` on crates.io
# belongs to another project.
name = "arko-tui"
version = "0.4.2"
edition = "2024"
rust-version = "1.89"
description = "A general-purpose agent for the terminal, with a shell, background jobs, file tools and workers that run in parallel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mesa-hills-research/arko"
readme = "README.md"
keywords = ["agent", "ai", "llm", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The evaluation harness runs from a checkout.
exclude = ["evals/"]

[lib]
name = "arko"
path = "src/lib.rs"
# No examples in the docs to run.
doctest = false

[[bin]]
name = "arko"
path = "src/main.rs"
required-features = ["tui"]

[features]
default = ["tui", "remote"]
# The command line and the terminal's front ends (the full-screen view, the
# line prompt, the setup screen). An app that drives sessions builds without it.
tui = ["dep:arboard", "dep:clap", "dep:crossterm", "dep:ratatui", "dep:rustyline", "dep:windows-sys", "dep:wl-clipboard-rs"]
# The web page's server (--remote, /remote). Without it, a session says
# this build has no web page.
remote = ["dep:axum", "dep:if-addrs", "dep:qrcodegen"]
# `arko::testing` (a local model server and the client for it,
# `Options::client`), for tests only, also those of an app built on the
# library. Not for builds that ship.
testing = []

[dependencies]
# The framework, from crates.io. CONTRIBUTING.md shows how to build against
# a local checkout of it.
arko_ai = "0.1.1"
arko_agents = "0.1.4"
arko_workflows = "0.1.2"
arko_index = "0.3.0"

async-trait = "0.1.79"
# The system clipboard, for the full-screen view's copies (X11 and XWayland,
# Wayland where the compositor has data-control, macOS, Windows).
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
# The remote web page's server (--remote), with HTTP/1.1, JSON and SSE only.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"], optional = true }
base64 = "0.22.1"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5", features = ["derive"], optional = true }
# The full-screen view (the default front end), with terminal events as a
# stream and copying through the terminal (OSC 52).
crossterm = { version = "0.29.0", features = ["event-stream", "osc52"], optional = true }
dotenvy = "0.15.7"
env_logger = "0.10"
futures-util = "0.3.31"
getrandom = "0.3.3"
if-addrs = { version = "0.15.0", optional = true }
ignore = "0.4.22"
log = "0.4.21"
qrcodegen = { version = "1.8.0", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "underline-color"], optional = true }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
subtle = "2.6.1"
tokio = { version = "1.37.0", features = ["full"] }
unicode-width = "0.2.0"
uuid = { version = "1.8.0", features = ["v4"] }
rustyline = { version = "18.0.1", default-features = false, features = ["with-file-history"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

# Whether a Wayland compositor has the data-control protocol, which decides
# how the full-screen view copies (arboard's own check, and the version it
# uses).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wl-clipboard-rs = { version = "0.9.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"], optional = true }

[dev-dependencies]
# Tests of the remote's server (built as arko_ai builds it).
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3"
